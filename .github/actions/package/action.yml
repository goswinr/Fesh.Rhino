name: Package
description: Publish all target frameworks and build the .yak packages for Rhino 8 and Rhino 9, without pushing them.

# Used by build.yml and release.yml, so that the release path is tested on every push.
# Needs a checkout and a .NET SDK set up before.
#
# Two distributions of the same version are built into bin/Release:
#   fesh-x.y.z-rh8-win.yak  with net48 and net8.0-windows
#   fesh-x.y.z-rh9-win.yak  with net10.0-windows
# The package manager matches the major version of the distribution tag, so Rhino 8 only gets rh8 and Rhino 9 only gets rh9.
# https://developer.rhino3d.com/guides/yak/the-anatomy-of-a-package/#distributions

outputs:
  version:
    description: Version of the latest release in CHANGELOG.md
    value: ${{ steps.pack.outputs.version }}

runs:
  using: composite
  steps:
    # One step per framework, so that a failure in the first one is not masked by the second.
    # --self-contained does not bundle the .NET runtime here, because this is a library project without a RuntimeIdentifier.
    # Rhino comes with its own .NET runtime, so it should not be bundled anyway:
    # https://discourse.mcneel.com/t/all-f-plugins-fail-to-load-on-net-8/213721/5
    # *.deps.json seems to be not used in net8 in Rhino.
    - name: Publish net48
      shell: pwsh
      run: dotnet publish --self-contained --configuration Release --framework net48

    - name: Publish net8.0-windows
      shell: pwsh
      run: dotnet publish --self-contained --configuration Release --framework net8.0-windows

    - name: Publish net10.0-windows
      shell: pwsh
      run: dotnet publish --self-contained --configuration Release --framework net10.0-windows

    - name: Arrange one folder per Rhino version
      # Each folder gets its own manifest.yml outside of the framework folders:
      # https://developer.rhino3d.com/guides/yak/the-anatomy-of-a-package/#a-note-on-net-multi-targeting
      #   bin\Release\rh8 : manifest.yml, logo.png, net48\, net8.0-windows\
      #   bin\Release\rh9 : manifest.yml, logo.png, net10.0-windows\
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $frameworks = [ordered]@{
          rh8 = @('net48', 'net8.0-windows')
          rh9 = @('net10.0-windows')
        }
        foreach ($rh in $frameworks.Keys) {
          New-Item -ItemType Directory -Path "bin\Release\$rh" | Out-Null
          Copy-Item -Path "bin\Release\manifest.yml", "bin\Release\logo.png" -Destination "bin\Release\$rh"
          foreach ($tfm in $frameworks[$rh]) {
            # Move publish files to root. This is to make sure there is only one folder containing all files.
            Move-Item   -Path "bin\Release\$tfm\publish\*" -Destination "bin\Release\$tfm" -Force
            Remove-Item -Path "bin\Release\$tfm\publish" -Recurse -Force
            Move-Item   -Path "bin\Release\$tfm" -Destination "bin\Release\$rh"
          }
        }

    # https://discourse.mcneel.com/t/github-action-to-yak/120815/3
    - name: Download Yak
      # The old https://files.mcneel.com/yak/tools/latest/yak.exe is deprecated since September 2026, and its 'yak build' crashes on this folder layout.
      # The versioned downloads are listed at https://developer.rhino3d.com/guides/yak/yak-cli-reference/#downloads
      # They are not Authenticode signed, so the file is pinned by its hash. Update both values together.
      shell: pwsh
      env:
        YAK_VERSION: '0.19.1' # the build for .NET 10
        YAK_SHA256: '656221A1E887A702191B9811A477517D02B5F663BE2CC6528F5E0C815DA37D12'
      run: |
        $ErrorActionPreference = 'Stop'
        Invoke-WebRequest `
          -Uri "https://files.mcneel.com/yak/tools/$env:YAK_VERSION/win-x64/yak.exe" `
          -OutFile 'bin\yak.exe'

        $hash = (Get-FileHash -Path 'bin\yak.exe' -Algorithm SHA256).Hash
        if ($hash -ne $env:YAK_SHA256) {
          throw "Downloaded yak.exe $env:YAK_VERSION has an unexpected SHA256 hash: $hash"
        }

    - name: Build Yak
      # needs in fsproj:
      # <Target Name="WriteChangelogVersion" AfterTargets="AfterBuild">
      #   <WriteLinesToFile File="bin/ChangelogVersion.txt" Lines="@(CurrentReleaseChangelog)" Overwrite="true" ContinueOnError="false" />
      # </Target>
      id: pack
      shell: pwsh
      working-directory: bin/Release
      run: |
        $ErrorActionPreference = 'Stop'
        $version = (Get-Content ..\ChangelogVersion.txt -Raw).Trim()
        "version=$version" >> $env:GITHUB_OUTPUT

        foreach ($rh in 'rh8', 'rh9') {
          Push-Location $rh
          ..\..\yak.exe build --platform win --version $version
          if ($LASTEXITCODE -ne 0) {
            throw "yak build for $rh failed with exit code $LASTEXITCODE"
          }

          # yak infers the distribution tag from the highest RhinoCommon reference in the framework folders, e.g. fesh-0.32.3-rh8_19-win.yak
          # The minor version is dropped, to not restrict the package to Rhino 8.19 or higher.
          # (Up to 0.33.2 there was only one distribution for all Rhino versions, published as 'any-win'.)
          # Renaming the file is the documented way to change the distribution tag:
          # https://developer.rhino3d.com/guides/yak/creating-a-rhino-plugin-package/
          $yakFiles = @(Get-ChildItem -Path . -Filter '*.yak' -File)
          if ($yakFiles.Count -ne 1) {
            throw "Expected exactly one .yak file in $rh, found $($yakFiles.Count)."
          }
          $tagPattern = "-$rh(_\d+)?-win\.yak$"
          if ($yakFiles[0].Name -notmatch $tagPattern) {
            throw "Unexpected distribution tag in $($yakFiles[0].Name), expected one for $rh."
          }
          $name = $yakFiles[0].Name -replace $tagPattern, "-$rh-win.yak"
          # all .yak files end up in bin\Release, release.yml pushes them from there
          Move-Item -Path $yakFiles[0].FullName -Destination "..\$name"
          Pop-Location
          Write-Host "Built $name"
        }
