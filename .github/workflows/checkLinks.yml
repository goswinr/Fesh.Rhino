name: Check Links

on:
  push:
    tags:
      - '*'
  schedule:
    - cron: '0 6 * * 6'

jobs:
  linkinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: JustinBeckwith/linkinator-action@v2.5.0
        with:
          paths: README.md CHANGELOG.md
          linksToSkip: "https://www.food4rhino.com/en/app/fesh"
