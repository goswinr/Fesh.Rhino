# https://github.com/marketplace/actions/delete-workflow-runs
name: Delete old workflow runs
on:
  schedule:
    - cron: "0 4 * * 1" # Weekly on Monday at 04:00
  # to allow manual triggering of the workflow from the GitHub Actions tab:
  workflow_dispatch:

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:

      - name: Delete all successful runs of dependabot and cleanup
        # those have no badge in the readme
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: dependabot|cleanup
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: success


      - name: Delete all but last run of all other workflow runs (build, release and link check)
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          # keep only the last build and release run for the badges in the readme,
          # this job runs once per action name.
          # this will also keep runs older than 'retain_days'
          keep_minimum_runs: 1
          delete_run_by_conclusion_pattern: success
          # skip runs of open pull requests, otherwise a Dependabot PR run could be the one that is kept,
          # and the last push run on main, that the build badge shows, would get deleted.
          check_pullrequest_exist: true

      - name: Delete all failed runs older than 30 days
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: action_required|cancelled|failure|skipped
