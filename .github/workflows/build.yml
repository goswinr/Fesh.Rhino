name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # to allow manual triggering of the workflow from the GitHub Actions tab:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'

      # same steps as in release.yml, just without pushing the package
      - name: Publish and build Yak package
        uses: ./.github/actions/package
